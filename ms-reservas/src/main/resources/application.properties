spring.application.name=ms-reservas
server.port=8082
spring.datasource.url=${RESERVAS_DB_URL:jdbc:mysql://127.0.0.1:3306/sanaesencia_reservas}
spring.datasource.username=${RESERVAS_DB_USER:sana_reservas}
spring.datasource.password=${RESERVAS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
usuarios.api.url=${USUARIOS_API_URL:http://127.0.0.1:8080}
catalogo.api.url=${CATALOGO_API_URL:http://127.0.0.1:8081}
centro.zona=America/Santiago
centro.latitud=${CENTRO_LATITUD:-31.909825}
centro.longitud=${CENTRO_LONGITUD:-71.512501}
centro.umbral-online-km=20
agenda.paso-minutos=30
